<svg xmlns="http://www.w3.org/2000/svg" viewBox="415 231 330 350" width="660" height="700"><style>.roster-breathe { animation:roster-breath var(--roster-breath,7s) ease-in-out infinite; }
.roster-head { transform-origin:0px 52px; }
.roster-eyes { animation:roster-blink var(--roster-blink,11.3s) linear infinite; }
.roster-miles-morales .miles-mask path[fill=&quot;#df354b&quot;] { fill:#252c3c; }
.roster-miles-morales .miles-mask path[fill=&quot;#922b48&quot;] { fill:#151f31; }
.roster-miles-morales .miles-mask g[stroke=&quot;#241d32&quot;] { stroke:#b1475e; }
.roster-miles-morales .miles-mask g[fill=&quot;#f5f6e9&quot;] { stroke:#b94561; }
.roster-miles-morales .roster-head { animation:miles-survey 21s ease-in-out infinite; }
.roster-action-spray .roster-near { animation:miles-paint 9s ease-in-out infinite; }
.roster-action-spark .roster-near { animation:miles-charge 12s ease-in-out infinite; }
.roster-gwen-stacy .roster-near { animation:gwen-snare 5.2s ease-in-out infinite; }
.roster-gwen-stacy .roster-far { animation:gwen-snare 5.2s ease-in-out -.35s infinite; }
.roster-gwen-stacy.roster-action-cymbal .roster-near { animation:gwen-accent 7s ease-in-out infinite; }
.roster-gojo-satoru.roster-action-blindfold .roster-near { animation:gojo-adjust 14s ease-in-out infinite; }
.roster-gojo-satoru.roster-action-infinity .roster-near { animation:gojo-balance 11s ease-in-out infinite; }
.roster-levi-ackerman.roster-action-blade .roster-near { animation:levi-polish 10s ease-in-out infinite; }
.roster-levi-ackerman.roster-action-cup .roster-near { animation:levi-sip 17s ease-in-out infinite; }
.roster-l-lawliet .roster-head { animation:l-deduce 27s ease-in-out infinite; }
.roster-l-lawliet.roster-action-sugar .roster-near { animation:l-sugar 16s ease-in-out infinite; }
.roster-l-lawliet .roster-eyes { animation-duration:17.7s; }
.roster-cloth { transform-origin:0px 65px; animation:roster-cloth 13s ease-in-out infinite; }
@keyframes roster-breath { 50% { transform:translateY(-.65px); } }
@keyframes roster-blink { 0%,43%,46%,100% { transform:scaleY(1); } 44.5% { transform:scaleY(.08); } }
@keyframes roster-cloth { 50% { transform:skewX(.25deg); } }
@keyframes miles-survey { 0%,60%,100% { transform:rotate(0); } 74%,83% { transform:rotate(-3deg); } }
@keyframes miles-paint { 0%,35%,100% { transform:rotate(0); } 50%,70% { transform:rotate(3deg); } }
@keyframes miles-charge { 50% { transform:rotate(-2deg); } }
@keyframes gwen-snare { 0%,30%,65%,100% { transform:rotate(0); } 38%,55% { transform:rotate(-2deg); } 42%,59% { transform:rotate(1deg); } }
@keyframes gwen-accent { 0%,45%,75%,100% { transform:rotate(0); } 58% { transform:rotate(-4deg); } 64% { transform:rotate(1.5deg); } }
@keyframes gojo-adjust { 0%,30%,75%,100% { transform:rotate(0); } 43%,60% { transform:rotate(2deg); } }
@keyframes gojo-balance { 50% { transform:rotate(-2deg); } }
@keyframes levi-polish { 0%,30%,100% { transform:rotate(0); } 42%,63% { transform:rotate(1.5deg); } 52%,73% { transform:rotate(-1.5deg); } }
@keyframes levi-sip { 0%,40%,100% { transform:rotate(0); } 56%,70% { transform:rotate(-5deg); } }
@keyframes l-deduce { 0%,60%,100% { transform:rotate(0); } 72%,88% { transform:rotate(4deg); } }
@keyframes l-sugar { 0%,35%,100% { transform:rotate(0); } 53%,68% { transform:rotate(-3deg); } }
.sanctuary-paused .roster-actor *, .room-hidden .roster-actor * { animation-play-state:paused!important; }
@media(prefers-reduced-motion:reduce) { .roster-actor * { animation:none!important; transition:none!important; } }
.roster-elsa .roster-near { animation:elsa-weave 12s ease-in-out infinite; }
.roster-elsa.roster-action-ribbon .roster-near { animation:elsa-ribbon 15s ease-in-out infinite; }
.roster-elsa .roster-braid { transform-origin:20px 30px; animation:elsa-braid 17s ease-in-out infinite; }
.roster-rapunzel.roster-action-brush .roster-near { animation:rapunzel-paint 9.2s ease-in-out infinite; }
.roster-rapunzel.roster-action-lantern .roster-near { animation:rapunzel-lantern 14s ease-in-out infinite; }
.roster-rapunzel .roster-head { animation:rapunzel-observe 22s ease-in-out infinite; }
.roster-moana.roster-action-compass .roster-head { animation:moana-stars 26s ease-in-out infinite; }
.roster-moana.roster-action-paddle .roster-near { animation:moana-paddle 13s ease-in-out infinite; }
.roster-moana .roster-eyes { animation-duration:13.1s; }
.roster-hermione-granger.roster-action-quill .roster-near { animation:hermione-annotate 7.8s ease-in-out infinite; }
.roster-hermione-granger.roster-action-wand .roster-near { animation:hermione-levitate 12.4s ease-in-out infinite; }
.roster-wednesday-addams.roster-action-type .roster-near { animation:wednesday-type 5.7s ease-in-out infinite; }
.roster-wednesday-addams.roster-action-type .roster-far { animation:wednesday-type 5.7s ease-in-out -.2s infinite; }
.roster-wednesday-addams.roster-action-bow .roster-near { animation:wednesday-bow 11s ease-in-out infinite; }
.roster-wednesday-addams .roster-eyes { animation-duration:24s; }
@keyframes elsa-weave { 0%,100% { transform:rotate(0); } 35%,65% { transform:rotate(-2.5deg); } }
@keyframes elsa-ribbon { 50% { transform:rotate(-4deg); } }
@keyframes elsa-braid { 50% { transform:rotate(.8deg); } }
@keyframes rapunzel-paint { 0%,30%,100% { transform:rotate(0); } 42%,68% { transform:rotate(2deg); } 55%,78% { transform:rotate(-1deg); } }
@keyframes rapunzel-lantern { 50% { transform:rotate(-3deg); } }
@keyframes rapunzel-observe { 0%,65%,100% { transform:rotate(0); } 75%,85% { transform:rotate(-3deg); } }
@keyframes moana-stars { 0%,55%,100% { transform:rotate(0); } 67%,83% { transform:rotate(-4deg); } }
@keyframes moana-paddle { 0%,100% { transform:rotate(0); } 45%,65% { transform:rotate(2deg); } }
@keyframes hermione-annotate { 0%,35%,100% { transform:rotate(0); } 44%,64% { transform:rotate(1deg); } 53%,73% { transform:rotate(-.7deg); } }
@keyframes hermione-levitate { 0%,30%,100% { transform:rotate(0); } 48%,64% { transform:rotate(-3deg); } }
@keyframes wednesday-type { 0%,35%,80%,100% { transform:rotate(0); } 43%,58%,72% { transform:rotate(.7deg); } 49%,64% { transform:rotate(-.5deg); } }
@keyframes wednesday-bow { 0%,20%,100% { transform:rotate(-2deg); } 45%,65% { transform:rotate(2deg); } }
.roster-l-lawliet .roster-breathe { transform-origin:0px 140px; animation:l-breath 8.3s ease-in-out infinite; }
@keyframes l-breath { 0%,100% { transform:rotate(-3deg); } 50% { transform:rotate(-3deg) translateY(-.6px); } }
/* Four quiet, occupation-specific rhythms; each leaves a long still interval. */
.roster-officer-k .roster-head { transform-origin:0px 51px; animation:k-assess 23s ease-in-out infinite; }
.roster-officer-k.roster-action-horse .roster-near { animation:k-evidence 19s ease-in-out infinite; }
.roster-neo.roster-action-type .roster-near { animation:neo-key 12s ease-in-out infinite; }
.roster-neo.roster-action-type .roster-far { animation:neo-key 12s 1.3s ease-in-out infinite reverse; }
.roster-neo.roster-action-spoon .tool-spoon { transform-origin:0 5px; animation:neo-spoon 18s ease-in-out infinite; }
.roster-cozy-study-girl.roster-action-pencil .roster-near { animation:journal-line 16s ease-in-out infinite; }
.roster-cozy-study-girl.roster-action-cup .roster-head { transform-origin:0 51px; animation:tea-pause 21s ease-in-out infinite; }
.roster-late-night-study-boy.roster-action-type .roster-near { animation:debug-keys 14s ease-in-out infinite; }
.roster-late-night-study-boy.roster-action-headphones .roster-near { animation:headphone-fit 20s ease-in-out infinite; }
@keyframes k-assess {0%,60%,100%{rotate:0deg}68%,80%{rotate:2deg}}
@keyframes k-evidence {0%,60%,100%{rotate:0deg}68%,80%{rotate:-2deg}}
@keyframes neo-key {0%,10%,14%,18%,70%,100%{rotate:0deg}12%,16%,72%{rotate:.7deg}}
@keyframes neo-spoon {0%,45%,100%{rotate:0deg}60%,80%{rotate:-11deg}}
@keyframes journal-line {0%,10%,14%,18%,22%,100%{rotate:0deg}12%,16%,20%{rotate:1deg}30%,34%{rotate:-1deg}}
@keyframes tea-pause {0%,60%,100%{rotate:0deg}70%,80%{rotate:2deg}}
@keyframes debug-keys {0%,8%,12%,16%,20%,100%{rotate:0deg}10%,14%,18%{rotate:.65deg}}
@keyframes headphone-fit {0%,10%,18%,100%{rotate:0deg}12%,16%{rotate:-1.8deg}}
.pet-cat .pet-body {transform-origin:0 104px;animation:pet-breath 5.7s ease-in-out infinite}
.pet-dog .pet-body {transform-origin:0 105px;animation:pet-breath 6.4s ease-in-out infinite}
.pet-tail {transform-origin:43px 88px;animation:cat-tail 17s ease-in-out infinite}
.pet-dog .pet-tail {animation:dog-tail 22s ease-in-out infinite}
.pet-grooming {rotate:0deg;animation:cat-wash 16s ease-in-out infinite}
.pet-cat.roster-action-paw .pet-head {animation:cat-wash-head 16s ease-in-out infinite}
.pet-cat.roster-action-leaf .pet-head {animation:cat-watch 19s ease-in-out infinite}
.pet-leaf {animation:leaf-drift 19s ease-in-out infinite}
.pet-offering {rotate:0deg;animation:dog-offer 21s ease-in-out infinite}
.pet-dog.roster-action-ear .pet-head {animation:dog-listen 23s ease-in-out infinite}
.pet-dog.roster-action-ear .pet-ear-right {transform-origin:0 -15px;animation:dog-ear 23s ease-in-out infinite}
.pet-cat .roster-eyes {animation:roster-blink 11s ease-in-out infinite}
.pet-dog .roster-eyes {animation:roster-blink 13s ease-in-out infinite}
@keyframes pet-breath {0%,100%{translate:0 0}50%{translate:0 -.5px}}
@keyframes cat-tail {0%,60%,100%{rotate:0deg}70%,80%{rotate:-3deg}}
@keyframes dog-tail {0%,20%,100%{rotate:0deg}12%,16%{rotate:-5deg}14%,18%{rotate:3deg}}
@keyframes cat-wash {0%,12%,20%,100%{rotate:0deg}14%,18%{rotate:3deg}}
@keyframes cat-wash-head {0%,10%,22%,100%{rotate:0deg}14%,18%{rotate:-3deg}}
@keyframes cat-watch {0%,100%{rotate:0deg}30%,50%{rotate:-5deg}70%{rotate:2deg}}
@keyframes leaf-drift {0%,100%{translate:0 0;rotate:0deg}50%{translate:-10px 10px;rotate:8deg}}
@keyframes dog-offer {0%,100%{rotate:0deg}40%,60%{rotate:3deg}}
@keyframes dog-listen {0%,60%,100%{rotate:0deg}70%,85%{rotate:7deg}}
@keyframes dog-ear {0%,65%,100%{rotate:0deg}72%,80%{rotate:-8deg}}

