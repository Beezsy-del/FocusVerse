.pet-ribcage{transform-origin:0px 90px;animation:illustrated-animal-breath 6.5s ease-in-out infinite}
.illustrated-purring-window-cat .pet-ribcage{animation-duration:5.8s}
.cat-tail-tip{transform-origin:66px 61px;animation:illustrated-cat-tip 16s ease-in-out infinite}
.cat-slow-blink{animation:illustrated-cat-blink 12s ease-in-out infinite}
.cat-groom-paw{animation:illustrated-cat-groom 4.8s ease-in-out infinite}
.cat-leaf-watch{animation:illustrated-cat-leaf 6s ease-in-out infinite}
.dog-tail-tip{transform-origin:52px 99px;animation:illustrated-dog-tail 19s ease-in-out infinite}
.dog-soft-blink{animation:illustrated-dog-blink 14s linear infinite}
.illustrated-observe .dog-ear-right,.illustrated-action.illustrated-tool-ear .dog-ear-right{transform-origin:0px -12px;animation:illustrated-dog-listen-ear 5s ease-in-out infinite}
